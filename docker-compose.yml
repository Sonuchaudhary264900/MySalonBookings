version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msb-backend
    image: salon-bookings/backend:latest
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - msb-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Salon User Frontend
  salon-user-frontend:
    build:
      context: ./salon-user-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:5000/api/v1
    container_name: msb-user-frontend
    image: salon-bookings/user-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - msb-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Salon Owner Frontend
  salon-owner-frontend:
    build:
      context: ./salon-owner-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:5000/api/v1
    container_name: msb-owner-frontend
    image: salon-bookings/owner-frontend:latest
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - msb-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Admin Frontend
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:5000/api/v1
    container_name: msb-admin-frontend
    image: salon-bookings/admin-frontend:latest
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - msb-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  msb-network:
    driver: bridge
