services:
  backend:
    build: ./backend
    container_name: msb-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  salon-user-frontend:
    build:
      context: ./salon-user-frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    container_name: msb-user-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  salon-owner-frontend:
    build:
      context: ./salon-owner-frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    container_name: msb-owner-frontend
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  admin-frontend:
    build:
      context: ./admin-frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    container_name: msb-admin-frontend
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
