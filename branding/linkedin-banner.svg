<linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#6D28D9"/>
  <stop offset="100%" stop-color="#A78BFA"/>
</linearGradient>

<linearGradient id="spkG" x1="0" y1="0" x2="0.4" y2="1">
  <stop offset="0%" stop-color="#FEF3C7"/>
  <stop offset="100%" stop-color="#FFFFFF"/>
</linearGradient>

<linearGradient id="divLine" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
  <stop offset="50%" stop-color="#9333EA" stop-opacity="0.6"/>
  <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
</linearGradient>

<filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="40"/>
</filter>

<filter id="spkGlow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="5"/>
</filter>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
</style>
