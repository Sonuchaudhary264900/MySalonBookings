<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Background -->
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0520"/>
      <stop offset="100%" stop-color="#1A0528"/>
    </linearGradient>

```
<!-- Brand gradient -->
<linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#5B21B6"/>
  <stop offset="100%" stop-color="#A78BFA"/>
</linearGradient>

<!-- Sparkle -->
<linearGradient id="spkG" x1="0" y1="0" x2="0.4" y2="1">
  <stop offset="0%" stop-color="#FEF3C7"/>
  <stop offset="100%" stop-color="#FFFFFF"/>
</linearGradient>

<!-- Soft glow -->
<filter id="bigHalo" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="60"/>
</filter>

<filter id="spkGlow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="6"/>
</filter>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
</style>
```

  </defs>

  <!-- Background -->

  <rect width="2560" height="1440" fill="url(#pageBg)"/>

  <!-- Minimal glow atmosphere -->

  <circle cx="500" cy="720" r="380" fill="#7C3AED" opacity="0.05" filter="url(#bigHalo)"/>
  <circle cx="2000" cy="720" r="300" fill="#A78BFA" opacity="0.05" filter="url(#bigHalo)"/>

  <!-- ICON -->

  <g transform="translate(840,500) scale(0.547)">
    <rect width="512" height="512" rx="120" fill="url(#brandGrad)"/>

```
<!-- Signature sparkle -->
<path d="M256,150 
         C270,210 310,240 370,256 
         C310,272 270,300 256,360 
         C242,300 202,272 142,256 
         C202,240 242,210 256,150 Z"
      fill="url(#spkG)"
      filter="url(#spkGlow)"/>
```

  </g>

