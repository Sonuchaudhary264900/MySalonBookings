# Development version of docker-compose with additional services
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

version: '3.8'

services:
  # Backend with live reload
  backend:
    environment:
      - NODE_ENV=development
      - DEBUG=app:*
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
      - "9229:9229"  # Node debug port
    command: npm run dev  # Ensure this exists in backend package.json

  # Nginx Proxy (optional - for testing production setup)
  nginx-proxy:
    image: nginx:alpine
    container_name: msb-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - salon-user-frontend
      - salon-owner-frontend
      - admin-frontend
      - backend
    networks:
      - msb-network

  # Portainer - Docker UI Management (optional)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: msb-portainer
    ports:
      - "9000:9000"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - msb-network
    restart: unless-stopped

volumes:
  portainer_data:

networks:
  msb-network:
    external: true
